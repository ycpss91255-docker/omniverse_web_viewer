name: Main CI/CD

on:
  push:
    branches: [main, master]
    tags:
      # VERSION SHAPE, not 'v*'. The old glob accepted names
      # script/ci/derive_image_tag.sh hard-rejects (`v2`, `vnext`, `vlatest`),
      # and that rejection lives in publish-image, the LAST job in the chain --
      # so such a tag cut a real GitHub Release first and only then failed,
      # producing exactly the Release-without-an-image state this file argues
      # against, after spending a full Tier B run on the shared GPU. Matching
      # the deriver's grammar here means an unpublishable ref never reaches the
      # Release step or the runner.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
  # Nightly, for the Tier B visual acceptance ONLY (#48). Every other job in
  # this workflow is gated off `schedule` below -- a scheduled run must not
  # rebuild and re-release the image, it exists to answer one question: does a
  # real Kit producer's picture still reach a real browser?
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      run_tier_b:
        description: >-
          Also run the Tier B visual acceptance (self-hosted GPU runner,
          boots a real Kit producer; minutes, and contends for the GPU).
          Not needed on a tag ref or for a publish -- both run it anyway.
        type: boolean
        default: false
      # Escape hatch ONLY (#66). The tag-triggered path derives the image tag
      # from the git ref and IGNORES this, so a release and its image cannot
      # drift; this exists for a manual publish off a ref that is not a tag.
      #
      # It is NOT an escape from the picture gate (#70): a non-empty value here
      # makes tier-b-visual-e2e run for this dispatch as well, and the publish
      # is gated on it succeeding exactly as a tag push is.
      #
      # Nor is it an escape from the release/image pairing: this value is only
      # SHAPE-checked by derive_image_tag.sh, and GHCR tags are mutable, so
      # publish-image additionally requires the version to already exist as the
      # tag v<version> AT THIS EXACT COMMIT. See the guard step in that job.
      publish_image_tag:
        description: >-
          Publish the runtime image to GHCR under this version (e.g. 0.3.0).
          Ignored on a tag ref -- the tag itself wins. Leave empty to publish
          nothing. Publishing ALWAYS runs the Tier B visual acceptance first
          (self-hosted GPU runner), whatever the box above says. Off a non-tag
          ref the version must already be a tag pointing at the commit being
          built, or the publish is refused.
        type: string
        default: ''

# NO workflow-level `permissions:` block. `contents: write` used to live here,
# for call-release's benefit alone, and every other job inherited it -- including
# call-docker-build, which runs on EVERY pull_request, and tier-b-visual-e2e,
# which runs on a persistent, shared, self-hosted GPU host.
#
# actions/checkout persists that token into .git/config on the runner, so the
# least-trusted job in the file (a build driven by a Dockerfile and build args
# that come from the PR branch) sat next to a token that can push commits and
# create tags -- and creating a `v*` tag is itself a trigger in this file, i.e.
# directly upstream of the release path. Same-repo branch PRs get the full write
# token; only FORK PRs are forced read-only by GitHub, so branch protection does
# not contain this. On the GPU host the same token would let a compromise of the
# pulled producer image, or another tenant on that shared machine, escalate from
# GPU-host access to pushing to this repo.
#
# The grant is now on call-release ONLY, which is where it was always for.
# Job-level permissions are honoured on jobs that `uses:` a reusable workflow --
# publish-image already relied on that -- and reusable-workflow permissions
# intersect with the caller's, so release-worker.yaml declaring it upstream is
# still not enough on its own.
#
# ---------------------------------------------------------------------------
# ACTION PINNING POLICY: every third-party `uses:` in this file is pinned to a
# full commit SHA, with the human-readable version in a trailing comment. Major
# version tags are MUTABLE -- the tj-actions/changed-files incident retagged
# every version tag to malicious code -- and this file hands GITHUB_TOKEN with
# `packages: write` to docker/login-action and lets docker/build-push-action do
# the push, so a retag of either would yield the registry credential and the
# ability to publish arbitrary content to
# ghcr.io/ycpss91255-docker/omniverse_web_viewer, which downstream consumers pin
# and execute. `busybox` is pinned by digest for the same reason and one more:
# that container runs as root with the workspace bind-mounted, BEFORE checkout,
# on a persistent self-hosted GPU host.
#
# `ycpss91255-docker/base/...` reusable workflows stay on version TAGS
# deliberately: they are first-party, the tags are ours, and the refs are the
# subject of their own tracked decisions (#37, #67, base#915). Bumping a pin
# means replacing both the SHA and the trailing version comment -- there is no
# dependabot `github-actions` entry in this repo yet, so that is manual today.
# ---------------------------------------------------------------------------

jobs:
  call-docker-build:
    # Not on the nightly schedule: that trigger is for tier-b-visual-e2e only.
    if: github.event_name != 'schedule'
    # Builds and tests; pushes nothing (build-worker passes push: false to every
    # build and carries no registry login). Read is all it can justify.
    permissions:
      contents: read
    uses: ycpss91255-docker/base/.github/workflows/build-worker.yaml@v0.41.0
    with:
      image_name: omniverse_web_viewer
      submodules: recursive
      build_runtime: true
      test_tools_version: v0.41.0
      # Tier-1 browser config-dial e2e (#47): an extra Dockerfile stage
      # (FROM runtime) that boots the served dists in headless Chromium and
      # asserts the bundle dials the injected server/port (+ media). No GPU,
      # no Isaac, no self-hosted runner -- runs per-PR on the hosted builder.
      extra_stages: e2e-test
      # The Dockerfile's runtime-test stage bakes a strong default
      # RUNTIME_SMOKE_CMD (serve + curl 200 for BOTH /app/usd-viewer/dist
      # and /app/stream-only/dist), so passing it here is optional. We pass
      # it explicitly so the production serve smoke is visible in the CI
      # config, not only in the Dockerfile. Single quotes around the inner
      # bash -c body keep the YAML value one literal line.
      build_args: |
        RUNTIME_SMOKE_CMD=timeout 30 bash -c 'serve -s /app/usd-viewer/dist -l 5173 & serve -s /app/stream-only/dist -l 5174 & for _ in $(seq 1 30); do if curl -fsS http://127.0.0.1:5173 >/dev/null 2>&1 && curl -fsS http://127.0.0.1:5174 >/dev/null 2>&1; then exit 0; fi; sleep 0.5; done; exit 1'

  call-release:
    # THE PICTURE GATE (#70). v0.3.0-rc1 was published without the Tier B
    # visual acceptance ever having run for that commit -- a tag push skipped
    # it, and the Release cut anyway. Standing rule from here on: no version
    # may be published without the picture having been verified.
    #
    # tier-b-visual-e2e (defined at the bottom of this file, and now triggered
    # by tag pushes too) is therefore a hard `needs` of this job.
    #
    # NOTE the deliberate ABSENCE of a status function in the `if` below. With
    # no `always()` / `!cancelled()` / `success()` anywhere in it, GitHub keeps
    # the default rule "a job is skipped when any job it needs did not
    # succeed", and a SKIPPED Tier B propagates as a skip to this job. That is
    # the intended outcome: if the self-hosted GPU runner is unavailable, the
    # release is BLOCKED, not waved through. There is no override input, no
    # continue-on-error and no `if: always()` escape by design -- an override
    # on this gate would be reached for exactly when it matters most.
    needs: [call-docker-build, tier-b-visual-e2e]
    if: startsWith(github.ref, 'refs/tags/')
    # Back on a released base tag: the temporary commit-SHA pin from #66 is
    # gone and #67's condition is met. v0.42.0's archive step copies
    # `Dockerfile script/ .hadolint.yaml test/bats/smoke/ .base/ README.md
    # doc/` and hard-fails on any path the consumer lacks (upstream robustness
    # fix base#914 is still open); this tree now satisfies all seven, the last
    # of them because the bats specs moved to test/bats/smoke/ -- base's own
    # ADR-00000012 layout -- rather than because the list was worked around.
    #
    # call-docker-build stays on v0.41.0 ON PURPOSE. Moving the build worker is
    # a separate change with its own verification (#37); the mixed pinning is
    # deliberate, not an oversight. Likewise the .base subtree stays at v0.41.0
    # -- base#915 records that the v0.42.0 upgrade path is broken for a v0.41.0
    # consumer, and only the workflow ref moves here.
    # The ONLY job that needs write. release-worker runs
    # softprops/action-gh-release, which creates a GitHub Release; GitHub's
    # default GITHUB_TOKEN is read-only, and reusable-workflow permissions
    # intersect with the caller's, so the grant has to be here rather than
    # upstream -- but here means THIS job, not the whole workflow.
    permissions:
      contents: write
    uses: ycpss91255-docker/base/.github/workflows/release-worker.yaml@v0.42.0
    with:
      archive_name_prefix: omniverse_web_viewer

  # ------------------------- GHCR image publish (#66) -----------------------
  # The other half of a release. A tag must emit a GitHub Release AND a GHCR
  # image whose version strings MATCH, so the two are traceable in both
  # directions -- given an image you can find its source release, and given a
  # release you can find its image. Downstream consumer: isaac#173, which wants
  # a pinned, released viewer to test against instead of whatever the
  # `web_viewer` submodule happens to point at.
  #
  # Same workflow, same run, same commit as call-release: that is what makes
  # the pairing structural rather than a convention someone has to remember.
  #
  # The image tag is DERIVED from the git ref by script/ci/derive_image_tag.sh
  # (v0.3.0 -> :0.3.0, v0.3.0-rc1 -> :0.3.0-rc1), never hand-entered on this
  # path, so it cannot drift from the release. `publish_image_tag` is an escape
  # hatch for a manual publish off a non-tag ref and is ignored on a tag ref.
  #
  # No `:latest`. A moving tag is precisely what a downstream pin must not be,
  # and an rc must never become the tag consumers get by default.
  publish-image:
    # Gated on THREE things: never publish an image the build/test gate
    # rejected, never publish an image whose Release failed to cut, and -- the
    # #70 addition -- never publish an image whose picture was not verified.
    # A Release without an image is recoverable by dispatching this workflow;
    # an image with no Release behind it is a dangling artifact a consumer
    # could pin; an image nobody ever saw a frame from is what v0.3.0-rc1 was.
    #
    # `!cancelled()` rather than the implicit success(): a job whose `needs`
    # include a SKIPPED job is skipped unless the condition uses a status
    # function, and call-release is legitimately skipped on the manual
    # escape-hatch path (no tag ref). The explicit `needs.*.result` checks put
    # back the strictness that buys -- and note that only call-release is
    # allowed to be 'skipped'. tier-b-visual-e2e must be 'success' outright:
    # skipped, failed, cancelled and timed-out all block the publish, on the
    # tag path AND on the manual escape-hatch path (which is why a non-empty
    # publish_image_tag makes the Tier B job run for that dispatch too).
    needs: [call-docker-build, call-release, tier-b-visual-e2e]
    if: >-
      !cancelled()
      && needs.call-docker-build.result == 'success'
      && needs.tier-b-visual-e2e.result == 'success'
      && (needs.call-release.result == 'success'
          || needs.call-release.result == 'skipped')
      && (startsWith(github.ref, 'refs/tags/')
          || (github.event_name == 'workflow_dispatch'
              && inputs.publish_image_tag != ''))
    runs-on: ubuntu-latest
    # This job only reads the tree and writes a package, so that is all it
    # gets. It was the first job in this file to scope itself down; every job
    # now declares its own, and `contents: write` reaches call-release alone.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The runtime stage builds both app dists, and usd-viewer builds from
          # the upstream `src` submodule.
          submodules: recursive

      # `GITHUB_REPOSITORY` is ycpss91255-docker/omniverse_web_viewer, i.e. the
      # ghcr.io/ycpss91255-docker/omniverse_web_viewer the READMEs document; it
      # follows the repo automatically if it is ever renamed. The full
      # reference is assembled here so the push step below stays a one-liner
      # and the run summary records exactly what was published.
      - name: Derive the image reference from the git ref
        id: image
        env:
          PUBLISH_IMAGE_TAG: ${{ inputs.publish_image_tag }}
        run: |
          tag="$(bash script/ci/derive_image_tag.sh)"
          ref="ghcr.io/${GITHUB_REPOSITORY}:${tag}"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "Publishing \`${ref}\`" >> "${GITHUB_STEP_SUMMARY}"

      # THE ESCAPE HATCH'S MISSING GUARD.
      #
      # On a tag ref the version is DERIVED and cannot drift. On the dispatch
      # path it is typed by hand, derive_image_tag.sh checks only its SHAPE, and
      # GHCR tags are MUTABLE -- so a single dispatch from main with
      # publish_image_tag=0.3.0 would have replaced the image behind the v0.3.0
      # Release with a build of arbitrary branch code, silently. The downstream
      # consumer that pins :0.3.0 (isaac#173) would then be running code no
      # Release points at, with no signal that anything moved. The same input
      # could also mint a version-tagged image with no Release behind it at all
      # -- "a dangling artifact a consumer could pin", which the comment block
      # above this job names as the state to avoid.
      #
      # Rule: the requested version must ALREADY exist as the tag v<version>,
      # and that tag must point at the commit this run is building. The
      # documented recovery case still works -- a Release whose image push
      # failed is republished by dispatching with the TAG selected as the ref,
      # where derive_image_tag uses the ref and this check is satisfied by
      # construction -- while publishing branch code under a released version is
      # refused. Skipped entirely on the tag path, which cannot drift by design.
      - name: Refuse a hand-typed version that is not this commit's own tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          version="${IMAGE_REF##*:}"
          sha_re='^[0-9a-f]{40}$'
          # A miss prints an error BODY rather than failing quietly, so the
          # answer is validated by shape, not by exit status.
          object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" \
                      -q '.object.sha' 2>/dev/null || true)"
          if [[ ! "${object}" =~ ${sha_re} ]]; then
            echo "::error::refusing to publish ${IMAGE_REF}: no tag v${version} exists, so this image would have no Release behind it"
            exit 1
          fi
          # Lightweight tags point straight at a commit; annotated tags (what
          # this repo cuts) point at a tag object that must be dereferenced.
          commit="$(gh api "/repos/${GITHUB_REPOSITORY}/git/tags/${object}" \
                      -q '.object.sha' 2>/dev/null || true)"
          if [[ ! "${commit}" =~ ${sha_re} ]]; then
            commit="${object}"
          fi
          if [ "${commit}" != "${GITHUB_SHA}" ]; then
            echo "::error::refusing to publish ${IMAGE_REF}: tag v${version} is ${commit}, but this run builds ${GITHUB_SHA} -- publishing would re-point a released image at different code"
            exit 1
          fi
          echo "v${version} resolves to ${commit}, which is this run's commit."

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          # `runtime` is the lean deployable stage (built dists + serve, no
          # toolchain / src / node_modules) -- what a downstream consumer runs.
          target: runtime
          # linux/amd64 only: the platform call-docker-build actually builds
          # and gates (build-worker's default `platforms`). Publishing an
          # arm64 variant nothing in CI has tested would be a claim, not a
          # gate; arm64 users build locally, as documented in the README.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          # Reuse the runtime layers call-docker-build just built in this same
          # run. The scope key mirrors build-worker's own computation
          # (`${image_name}-${hardware}-runtime-cache`, base#272 / base#378);
          # it is a pure speedup, and a miss just rebuilds from source, so an
          # upstream change to that key degrades time, never correctness.
          cache-from: type=gha,scope=omniverse_web_viewer-x86_64-runtime-cache
          # The same user/uid the build-worker runtime build uses, so the
          # published image is the one CI gated rather than a look-alike with a
          # different ARG set (and so the cache above actually hits).
          build-args: |
            USER_NAME=ci
            USER_GROUP=ci
            USER_UID=1000
            USER_GID=1000

  # ------------------------- Tier B visual acceptance (#48) -----------------
  # The gate that finally answers "is there actually a picture?" without a
  # human in front of a browser: a REAL Kit producer (the pinned deterministic
  # ghcr.io/ycpss91255-docker/isaac-stream-source image, isaac#223) -> the REAL
  # served stream-only dist -> headless Chromium, asserting a connected
  # RTCPeerConnection, a remote track, videoWidth > 0 and a NON-BLACK sampled
  # frame. Everything per-PR stops one step short of that (config dial against
  # a dead host; status states against a canvas the spec paints itself).
  #
  # NOT per-PR, on purpose: the producer boots Kit (minutes) and needs the GPU.
  # Nightly, every RELEASE path, and explicit manual opt-in. `runs-on:
  # [self-hosted, gpu]` because no hosted runner has NVENC.
  #
  # The release path was added by #70. This job is the gate call-release and
  # publish-image hang off, so it must run wherever those two could run:
  #   - a tag ref     -> the release path itself
  #   - a dispatch with a non-empty publish_image_tag -> the manual publish,
  #                      which would otherwise be a hole in the same rule
  # It deliberately has NO `needs:`. Staying dependency-free is what keeps the
  # nightly semantics untouched (call-docker-build does not run on `schedule`,
  # so needing it would force a status function onto the gate job itself), and
  # this job rebuilds the e2e-test image from the checked-out tree anyway, so
  # it can never pass against a stale artifact. The cost is that on a tag push
  # it starts in parallel with call-docker-build rather than after it.
  #
  # The `concurrency` group below serialises the GPU: `cancel-in-progress:
  # false` means a tag pushed while the nightly run is in flight QUEUES behind
  # it instead of cancelling it. A release therefore waits for the GPU; that is
  # the accepted price of the rule.
  #
  # What `cancel-in-progress: false` does NOT protect is a job that is still
  # PENDING. GitHub cancels the previously pending member of a group when a new
  # run enters it, so with the nightly running and a tag queued behind it, a
  # third entrant (a dispatch with run_tier_b, another tag) cancels the tag's
  # Tier B outright. The consequence fails CLOSED -- call-release skips on a
  # non-success need and publish-image requires `result == 'success'`, so
  # nothing unsafe publishes -- but the pushed tag then produces no Release and
  # no image, and the only trace is a GREY cancelled job. That is why
  # `release-blocked-report` below exists: it turns that silence into a red
  # run. Do not read it as an override; it can only ADD a failure.
  #
  # stream-only ONLY. #48's acceptance criteria ask for both viewer modes, which
  # is wrong against an Isaac-family producer: #18 established that `usd-viewer`
  # (the upstream sample, built UNMODIFIED per D2) only works with the
  # kit-app-template USD Viewer and blanks against Isaac Sim BY DESIGN, so
  # asserting a picture there would fail forever. usd-viewer keeps its existing
  # per-PR config-dial cover.
  tier-b-visual-e2e:
    if: >-
      github.event_name == 'schedule'
      || startsWith(github.ref, 'refs/tags/')
      || (github.event_name == 'workflow_dispatch'
          && (inputs.run_tier_b || inputs.publish_image_tag != ''))
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    # Checks out, builds and runs containers -- nothing more. Explicitly read,
    # because this job runs on a persistent, shared host where a repo-write
    # token in the environment would turn GPU-host access into push access.
    permissions:
      contents: read
    # One Kit on the GPU at a time, and never cancel mid-teardown -- a killed
    # run would orphan a GPU-holding container. Mirrors isaac's stream-smoke.
    concurrency:
      group: owv-tier-b-visual-e2e
      cancel-in-progress: false
    steps:
      # Pre-checkout self-heal: a prior GPU run can leave root-owned residue in
      # the workspace that breaks the non-root runner's checkout clean step.
      # Mirrors isaac's stream-smoke; refs ycpss91255-docker/github_runner#77.
      - name: Pre-checkout cleanup (clear stale root-owned residue)
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}":/w -w /w busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616 sh -c '
            rm -rf .tier-b-artifacts 2>/dev/null
            true'

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      # base detect_ws_path mis-detects the self-CI _work/<repo>/<repo> layout;
      # pin WS_PATH to the checkout root in the derived cache so the compose
      # build resolves. Same fix isaac applies in stream-smoke (base#586).
      - name: Generate .env + compose.yaml (pin WS_PATH)
        run: |
          ./script/setup.sh apply
          sed -i "s|^WS_PATH=.*|WS_PATH=${GITHUB_WORKSPACE}|" .env.generated

      # The same stage the per-PR gate builds. Building it here also re-runs the
      # tier-1 in-image gate, so a Tier B run can never pass on a stale image.
      - name: Build the e2e-test image (viewer + browser in one)
        run: ./script/build.sh -t e2e-test

      # Explicit, so a registry problem is distinguishable from an acceptance
      # failure and a multi-GB pull does not eat the acceptance step's budget.
      #
      # The reference comes FROM the driver rather than being repeated here:
      # the producer is pinned by DIGEST (it runs as root with
      # `--network=host --ipc=host --gpus all` on this persistent shared GPU
      # host, and GHCR tags are mutable -- see the driver's own note and the
      # busybox pin above), and a second copy of that digest in this file is a
      # thing that can drift from the one actually run.
      - name: Pull the pinned producer image
        run: docker pull "$(bash script/ci/tier_b_visual_e2e.sh --print-producer-image)"

      # Boots the producer, waits for its streaming server, drives the browser,
      # and tears down its own instance-scoped containers on every exit path.
      - name: Tier B visual acceptance (real producer -> real frames)
        run: bash script/ci/tier_b_visual_e2e.sh

      - name: Upload evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tier-b-visual-e2e-evidence
          path: .tier-b-artifacts
          if-no-files-found: ignore

  # ------------------- blocked-release visibility (report only) -------------
  # NOT A GATE, and deliberately incapable of being one: nothing `needs` this
  # job, so it can only ADD a failure to a run and can never allow a publish.
  # The `always()` here is what lets it observe a need that did not succeed; it
  # is not the `if: always()` the picture-gate rule forbids, which would be one
  # that lets a release THROUGH.
  #
  # It exists because the gate can fail SILENTLY. A tag's Tier B that is still
  # queued behind the nightly is cancelled outright when a third run enters the
  # shared concurrency group (GitHub cancels the previously pending member;
  # `cancel-in-progress: false` only protects a RUNNING job). Everything
  # downstream then fails closed and simply does not run: call-release skips on
  # a non-success need, publish-image requires `result == 'success'`. Correct --
  # but the pushed tag produces no Release and no image, and the only signal is
  # a grey cancelled job on a green-looking run. A maintainer reading the
  # concurrency comment would reasonably conclude "it is queued, it will run",
  # and the release quietly never happens.
  #
  # Tag refs only: on the nightly and on dispatches there is no release to
  # block, and a failing Tier B there is already red on its own.
  release-blocked-report:
    needs: [tier-b-visual-e2e]
    if: >-
      always()
      && startsWith(github.ref, 'refs/tags/')
      && needs.tier-b-visual-e2e.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail loudly, so a blocked release is red rather than grey
        env:
          TIER_B_RESULT: ${{ needs.tier-b-visual-e2e.result }}
        run: |
