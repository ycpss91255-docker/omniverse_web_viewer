[[image.rules]]
rule = "string:omniverse_web_viewer"

[[image.rules]]
rule = "suffix:_ws"

[[image.rules]]
rule = "@basename"

[build]
target_arch = ""
network = "auto"

[[build.args]]
key = "APT_MIRROR_UBUNTU"
value = "tw.archive.ubuntu.com"

[[build.args]]
key = "APT_MIRROR_DEBIAN"
value = "mirror.twds.com.tw"

[[build.args]]
key = "TZ"
value = "Asia/Taipei"

[deploy]
gpu_mode = "off"
gpu_count = "all"
gpu_capabilities = "gpu compute utility graphics"
gpu_runtime = "auto"

[gui]
mode = "off"

[network]
mode = "host"
ipc = "host"
network_name = ""
ports = []

[security]
privileged = false
cap_add = []
cap_drop = []
security_opt = []

[resources]
shm_size = ""

[environment]
env_1 = "SIGNALING_SERVER=127.0.0.1"
env_2 = "SIGNALING_PORT=49100"
env_3 = "SERVE_PORT=5173"
env_4 = "VIEWER_UI_MODE=stream-only"

[[volumes]]
source = "${WS_PATH}"
target = "/home/${USER_NAME}/work"

[logging]
driver = "json-file"
max_size = "10m"
max_file = 3
compress = true
local_path = ""

