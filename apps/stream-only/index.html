<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omniverse Stream</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #remote-video {
        position: fixed; inset: 0; width: 100vw; height: 100vh;
        object-fit: contain; background: #000;
      }
      #stream-status {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #8b949e; font-size: 0.95rem; text-align: center;
        white-space: pre-line; padding: 1rem 1.5rem; max-width: 80vw;
        pointer-events: none;
      }
      #stream-status.error { color: #f85149; }
      /* Cleared once the remote video is actually rendering (issue #53): the
         connect-time "streaming ..." readout is transient, not a permanent
         centered caption over the live viewport. */
      #stream-status.hidden { display: none; }
    </style>
  </head>
  <body>
    <!-- Full-screen, no chrome. videoElementId / audioElementId match stream-core's config. -->
    <video id="remote-video" autoplay playsinline></video>
    <audio id="remote-audio" autoplay></audio>
    <div id="stream-status">Connecting...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
